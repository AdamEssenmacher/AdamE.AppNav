name: Release Confidence

on:
  pull_request:
  push:
    branches:
      - main
      - preview
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional v-prefixed preview tag used to build immutable candidate packages
        required: false
        type: string
        default: ""
      run-ios-platform-tests:
        description: Run iOS simulator DeviceRunners tests
        required: false
        type: boolean
        default: false
      run-android-platform-tests:
        description: Run Android API 36 compatibility tests; API 37 coverage is deferred
        required: false
        type: boolean
        default: false
      run-android-api28-platform-tests:
        description: Run Android API 28 emulator DeviceRunners tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CONFIGURATION: Release
  APPNAV_RELEASE_TAG: ${{ inputs.release_tag || '' }}

jobs:
  unit-api-allocation:
    name: Unit, API, and allocation contracts
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install pinned MAUI workload set
        run: dotnet workload install maui
      - name: Run deterministic contracts
        run: eng/verify.sh contracts

  analyzer-pack:
    name: Supported targets, analyzers, and packages
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"
      - name: Install pinned MAUI workload set
        run: dotnet workload install maui
      - name: Build, analyze, pack, inspect, and consume
        run: eng/verify.sh packages
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.release_tag && format('packages-{0}', inputs.release_tag) || 'packages' }}
          path: artifacts/packages

  maccatalyst-nativeaot:
    name: Mac Catalyst NativeAOT
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install maui
      - run: eng/verify.sh native-maccatalyst
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maccatalyst-nativeaot
          path: artifacts/native/maccatalyst-arm64

  android-full-trim:
    name: Android arm64 full trim
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"
      - run: dotnet workload install maui
      - run: eng/verify.sh native-android
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-full-trim
          path: artifacts/native/android-arm64

  ios-linked:
    name: iOS arm64 linked publish
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install maui
      - run: eng/verify.sh native-ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-linked
          path: artifacts/native/ios-arm64

  maccatalyst-platform-tests:
    name: Mac Catalyst platform tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install maui
      - run: eng/run-maui-platform-tests.sh maccatalyst
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maccatalyst-device-runners
          path: artifacts/device-runners

  ios-platform-tests:
    name: iOS latest simulator platform tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.run-ios-platform-tests || inputs.release_tag != ''))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install maui
      - run: eng/run-maui-platform-tests.sh ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-device-runners-artifacts
          path: artifacts/device-runners

  android-platform-tests:
    name: Android API 36 compatibility (API 37 deferred)
    runs-on: macos-26-intel
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.run-android-platform-tests || inputs.release_tag != ''))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"
      - run: dotnet workload install maui
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: eng/run-maui-platform-tests.sh android
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-device-runners-artifacts
          path: artifacts/device-runners

  android-api28-platform-tests:
    name: Android API 28 platform tests
    runs-on: macos-26-intel
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 0') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.run-android-api28-platform-tests || inputs.release_tag != ''))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"
      - run: dotnet workload install maui
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          script: eng/run-maui-platform-tests.sh android
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-api28-device-runners-artifacts
          path: artifacts/device-runners
